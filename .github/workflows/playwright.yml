name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        # auth/credentials.json is gitignored, so CI logs in with these
        # (tests/auth.setup.js falls back to them). Add them under
        # Settings > Secrets and variables > Actions.
        HAULER_EMAIL: ${{ secrets.HAULER_EMAIL }}
        HAULER_PASSWORD: ${{ secrets.HAULER_PASSWORD }}
        HAULER_VENDOR: ${{ secrets.HAULER_VENDOR }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
